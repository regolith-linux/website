# This site is retired: every page sends the reader to regolith-desktop.com.
# See layouts/partials/hooks/head-end.html.
#
# pages: every path this site publishes (without the /ja or /pl prefix),
# mapped to the closest page of the new site. A path that isn't listed,
# such as an old link to a page that no longer exists, goes where its
# closest listed parent goes (in the end, the new home page).
#
# ja: the pages of the new site that have a Japanese version. Japanese
# readers go to those; for every other page, and for Polish readers, the
# English page.

